<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" role="img">
<title>De zéro à l'appli en prod</title>
<desc>Cinq étapes : Terraform crée l'infrastructure, Ansible configure les machines, Docker construit et publie l'image, Helm déploie le chart, Kubernetes fait tourner l'application. En dev local, Compose remplace les étapes 4 et 5.</desc>
<style>
text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
.t { font-size: 14px; font-weight: 700; } .s { font-size: 12px; }
.m { font-size: 12px; font-family: "Liberation Mono", "DejaVu Sans Mono", monospace; fill: #2c2c2a; }
.pu rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: .8; } .pu .t { fill: #3C3489; } .pu .s { fill: #534AB7; }
.te rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: .8; } .te .t { fill: #085041; } .te .s { fill: #0F6E56; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; }
.n circle { fill: #f1efe8; stroke: #888780; } .n text { font-size: 13px; font-weight: 700; fill: #444441; text-anchor: middle; dominant-baseline: central; }
</style>
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="pu"><rect x="60" y="10" width="340" height="70" rx="8"/><text class="t" x="230" y="34" text-anchor="middle" dominant-baseline="central">Créer l'infrastructure</text><text class="s" x="230" y="56" text-anchor="middle" dominant-baseline="central">VPC, VMs, cluster k8s managé</text></g>
<g class="pu"><rect x="60" y="110" width="340" height="70" rx="8"/><text class="t" x="230" y="134" text-anchor="middle" dominant-baseline="central">Configurer les machines</text><text class="s" x="230" y="156" text-anchor="middle" dominant-baseline="central">Bastion, runners CI (si besoin)</text></g>
<g class="te"><rect x="60" y="210" width="340" height="70" rx="8"/><text class="t" x="230" y="234" text-anchor="middle" dominant-baseline="central">Construire et publier l'image</text><text class="s" x="230" y="256" text-anchor="middle" dominant-baseline="central">Dockerfile vers registry</text></g>
<g class="te"><rect x="60" y="310" width="340" height="70" rx="8"/><text class="t" x="230" y="334" text-anchor="middle" dominant-baseline="central">Déployer avec le chart</text><text class="s" x="230" y="356" text-anchor="middle" dominant-baseline="central">values-prod.yaml</text></g>
<g class="te"><rect x="60" y="410" width="340" height="70" rx="8"/><text class="t" x="230" y="434" text-anchor="middle" dominant-baseline="central">L'appli tourne</text><text class="s" x="230" y="456" text-anchor="middle" dominant-baseline="central">Pods, Service, Ingress</text></g>
<g class="n"><circle cx="28" cy="45" r="13"/><text x="28" y="45">1</text><circle cx="28" cy="145" r="13"/><text x="28" y="145">2</text><circle cx="28" cy="245" r="13"/><text x="28" y="245">3</text><circle cx="28" cy="345" r="13"/><text x="28" y="345">4</text><circle cx="28" cy="445" r="13"/><text x="28" y="445">5</text></g>
<g class="m"><text x="425" y="38">Terraform</text><text x="425" y="56" font-weight="700">terraform apply</text>
<text x="425" y="138">Ansible</text><text x="425" y="156" font-weight="700">ansible-playbook site.yml</text>
<text x="425" y="238">Docker</text><text x="425" y="256" font-weight="700">docker build, docker push</text>
<text x="425" y="338">Helm</text><text x="425" y="356" font-weight="700">helm upgrade --install</text>
<text x="425" y="438">Kubernetes</text><text x="425" y="456" font-weight="700">kubectl get pods</text></g>
<line class="arr" x1="230" y1="80" x2="230" y2="108" marker-end="url(#b)"/>
<line class="arr" x1="230" y1="180" x2="230" y2="208" marker-end="url(#b)"/>
<line class="arr" x1="230" y1="280" x2="230" y2="308" marker-end="url(#b)"/>
<line class="arr" x1="230" y1="380" x2="230" y2="408" marker-end="url(#b)"/>
<rect x="60" y="510" width="560" height="56" rx="8" fill="none" stroke="#888780" stroke-width=".8" stroke-dasharray="5 4"/>
<text class="t" x="340" y="529" text-anchor="middle" dominant-baseline="central" fill="#444441">En dev local : Docker Compose</text>
<text class="s" x="340" y="549" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">remplace les étapes 4 et 5 (docker compose up)</text>
</svg>
