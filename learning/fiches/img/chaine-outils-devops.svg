<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" role="img">
<title>Chaîne d'outils DevOps</title>
<desc>Terraform crée l'infrastructure, Ansible configure les serveurs, Docker construit l'image, puis Compose ou Kubernetes la lancent. Helm déploie sur Kubernetes.</desc>
<style>
text { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; }
.t { font-size: 14px; font-weight: 700; } .s { font-size: 12px; }
.pu rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: .8; } .pu .t { fill: #3C3489; } .pu .s { fill: #534AB7; }
.te rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: .8; } .te .t { fill: #085041; } .te .s { fill: #0F6E56; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="pu"><rect x="140" y="10" width="400" height="56" rx="8"/><text class="t" x="340" y="28" text-anchor="middle" dominant-baseline="central">Terraform : crée l'infrastructure</text><text class="s" x="340" y="48" text-anchor="middle" dominant-baseline="central">VM, réseau, cluster k8s</text></g>
<g class="pu"><rect x="140" y="90" width="400" height="56" rx="8"/><text class="t" x="340" y="108" text-anchor="middle" dominant-baseline="central">Ansible : configure les serveurs</text><text class="s" x="340" y="128" text-anchor="middle" dominant-baseline="central">Installe Docker, paquets, users</text></g>
<g class="te"><rect x="140" y="170" width="400" height="56" rx="8"/><text class="t" x="340" y="188" text-anchor="middle" dominant-baseline="central">Docker : construit l'image</text><text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">Dockerfile vers image</text></g>
<g class="te"><rect x="60" y="270" width="240" height="56" rx="8"/><text class="t" x="180" y="288" text-anchor="middle" dominant-baseline="central">Docker Compose</text><text class="s" x="180" y="308" text-anchor="middle" dominant-baseline="central">Plusieurs conteneurs, 1 machine</text></g>
<g class="te"><rect x="380" y="270" width="240" height="56" rx="8"/><text class="t" x="500" y="288" text-anchor="middle" dominant-baseline="central">Kubernetes</text><text class="s" x="500" y="308" text-anchor="middle" dominant-baseline="central">Conteneurs sur un cluster</text></g>
<g class="te"><rect x="380" y="360" width="240" height="56" rx="8"/><text class="t" x="500" y="378" text-anchor="middle" dominant-baseline="central">Helm</text><text class="s" x="500" y="398" text-anchor="middle" dominant-baseline="central">Package les manifestes k8s</text></g>
<line class="arr" x1="340" y1="66" x2="340" y2="88" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="146" x2="340" y2="168" marker-end="url(#a)"/>
<line class="arr" x1="180" y1="226" x2="180" y2="268" marker-end="url(#a)"/>
<line class="arr" x1="500" y1="226" x2="500" y2="268" marker-end="url(#a)"/>
<line class="arr" x1="500" y1="358" x2="500" y2="328" marker-end="url(#a)"/>
</svg>
