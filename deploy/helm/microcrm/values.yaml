# Valeurs communes. dev les complète avec values-dev.yaml ; staging et production avec values-prodlike.yaml
# (identique pour les deux), puis values-<environnement>.yaml.

images:
  # Préfixe du registre, avec le « / » final (ex. ghcr.io/<propriétaire>/<dépôt>/). Vide : images locales.
  # Jamais écrit en dur ici : la CI et les scripts le calculent à partir du dépôt.
  repositoryPrefix: ""
  back: microcrm-back
  front: microcrm-front
  # Version des images. Vide : appVersion du chart.
  tag: ""
  # Empreintes `sha256:…` des images. Renseignée, l'empreinte désigne l'image à la place de la version : les pods
  # exécutent alors exactement ces binaires, quel que soit le sort de l'étiquette. Utilisé pour déployer en
  # staging puis en production les mêmes images.
  digests:
    back: ""
    front: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Origine publique du front, telle que le navigateur la voit. Elle est autorisée par le CORS du back : sans
# elle, les écritures sont refusées quand le TLS s'arrête à l'ingress.
publicUrl: http://localhost:8080

back:
  # Une seule instance : la base HSQLDB est interne au processus (en mémoire ou sur fichier). Plusieurs
  # instances auraient des données différentes. Passer à une base externe avant d'augmenter ce nombre.
  replicas: 1
  persistence:
    # false : base en mémoire, données de démonstration rechargées à chaque démarrage.
    enabled: false
    size: 1Gi
    storageClassName: ""
  # `ephemeral-storage` borne le disque local du pod (/tmp, journaux) : sans limite, il pourrait remplir le nœud.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
      ephemeral-storage: 100Mi
    limits:
      memory: 768Mi
      ephemeral-storage: 1Gi

front:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
      ephemeral-storage: 20Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 200Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  # Nom du Secret TLS ; vide : pas de TLS sur l'ingress.
  tlsSecretName: ""

# Limite le trafic entrant du back aux pods du front (appliquée seulement si le réseau du cluster gère les
# NetworkPolicy).
networkPolicy:
  enabled: true
