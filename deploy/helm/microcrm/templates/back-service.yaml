apiVersion: v1
kind: Service
metadata:
  name: {{ include "microcrm.fullname" . }}-back
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: back
spec:
  type: ClusterIP
  selector:
    {{- include "microcrm.selectorLabels" (dict "root" . "component" "back") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
