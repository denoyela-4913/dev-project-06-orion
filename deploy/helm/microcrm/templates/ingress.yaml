{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microcrm.fullname" . }}
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ required "ingress.host est requis avec TLS" .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host est requis" .Values.ingress.host | quote }}
      http:
        paths:
          # Tout passe par le front, qui relaie /api vers le back.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "microcrm.fullname" . }}-front
                port:
                  name: http
{{- end }}
