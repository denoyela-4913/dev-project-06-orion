apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microcrm.fullname" . }}-front
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  replicas: {{ .Values.front.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "microcrm.selectorLabels" (dict "root" . "component" "front") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microcrm.selectorLabels" (dict "root" . "component" "front") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "microcrm.podSecurityContext" . | nindent 8 }}
      containers:
        - name: front
          image: {{ include "microcrm.image" (dict "root" . "name" .Values.images.front) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Le binaire de Caddy porte cette capacité (Dockerfile) : sans elle dans les droits permis, le
              # noyau refuse de l'exécuter, même pour écouter sur 8080.
              add: [NET_BIND_SERVICE]
          env:
            # HTTP seul : le TLS est porté par l'ingress.
            - name: SITE_ADDRESS
              value: ":8080"
            - name: API_BASE_URL
              value: /api
            - name: API_UPSTREAM
              value: "{{ include "microcrm.fullname" . }}-back:8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /home/app/.local/share/caddy
            - name: caddy-config
              mountPath: /home/app/.config/caddy
      volumes:
        - name: tmp
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
