{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.fullname" . }}-back
  labels:
    {{- include "microcrm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "microcrm.selectorLabels" (dict "root" . "component" "back") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" (dict "root" . "component" "front") | nindent 14 }}
      ports:
        - port: 8080
{{- end }}
