# Staging et production : exactement les mêmes fichiers, pour que le staging soit identique à la production. Seules
# les valeurs propres à une installation (domaine, origine publique, ports) viennent de env/<environnement>.env.
# Redémarrage automatique, système de fichiers en lecture seule, droits Linux retirés, limites de mémoire, front en
# HTTPS et données conservées dans un volume (HSQLDB sur fichier). SITE_ADDRESS est le nom de domaine servi : avec
# un vrai domaine, Caddy obtient son certificat automatiquement ; avec `localhost`, il utilise son autorité interne.
# Le back reste sur une seule instance : HSQLDB sur fichier n'accepte qu'un processus.
services:
  back:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    environment:
      # `shutdown=true` : la base est fermée proprement quand la dernière connexion se ferme.
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/microcrm;shutdown=true;hsqldb.write_delay=false
      SPRING_DATASOURCE_USERNAME: sa
      # Le schéma est créé puis complété par Hibernate ; pas encore d'outil de migration (cf. docs/BACKLOG.md).
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - back-data:/data
  front:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS manquant (fichier env/<environnement>.env)}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    healthcheck:
      # Le certificat interne n'est pas connu de BusyBox : la vérification porte sur la réponse, pas sur le TLS.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost/healthz"]
    volumes:
      # Certificats et état de Caddy.
      - front-data:/home/app/.local/share/caddy
      - front-config:/home/app/.config/caddy

volumes:
  back-data:
  front-data:
  front-config:
