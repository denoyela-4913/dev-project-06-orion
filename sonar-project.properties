# Configuration de l'analyse SonarQube Cloud, lue par sonarqube-scan-action (cf. .github/workflows/ci.yml).
#
# sonar.organization et sonar.projectKey ne sont volontairement pas écrits ici: le workflow les calcule à
# partir du contexte GitHub (propriétaire et nom du dépôt), pour ne pas coder un identifiant en dur.

# Un seul projet Sonar pour tout le dépôt (front Angular, back Java, Dockerfile, workflows, scripts),
# comme avec l'ancienne analyse automatique: le périmètre analysé reste comparable à l'état initial.
# Avec le nouveau mode « analysis scope » de SonarQube Cloud, tout le projet est analysé par défaut:
# sonar.sources, sonar.tests et sonar.test.inclusions n'ont plus d'effet (avertissement du scanner),
# seules les exclusions restreignent le périmètre.
# Exclus: tests (specs Angular et leur préparation test-setup.ts, tests Java), dossiers générés et fichiers
# binaires (images, PDF, jar):
# sans cela le scanner les lit comme du texte et émet des avertissements d'encodage sans intérêt.
# learning/ est exclu aussi: ce sont des outils personnels de révision, ni livrés ni testés avec l'application.
# Les analyser fausserait la mesure de l'application (couverture, vulnérabilités, Quality Gate).
sonar.exclusions=**/*.spec.ts,front/src/test-setup.ts,back/src/test/**,scripts/test_*.py,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.angular/**,**/.gradle/**,**/*.png,**/*.jpg,**/*.pdf,**/*.jar,learning/**

# scripts/: outils de la CI et du dépôt, pas l'application. Analysés (bugs, sécurité), mais hors de la mesure de
# couverture, qui ne porte que sur le front et le back (leurs tests tournent dans le job `coverage`).
sonar.coverage.exclusions=scripts/**

# Les fichiers cachés (dont .github/workflows) font partie du périmètre analysé.
sonar.scanner.excludeHiddenFiles=false

# Java: le scanner générique a besoin des classes compilées (produites par ./gradlew test dans le job test-back,
# puis transmises au job sonar par artefact, comme les rapports de couverture ci-dessous).
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test

# Couverture: rapport JaCoCo (back, ./gradlew test) et lcov (front, ng test --code-coverage).
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
