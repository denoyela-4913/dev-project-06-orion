# Projet SonarQube Cloud « infra », lu par le job `sonar-infra` de .github/workflows/ci.yml (base: racine du dépôt).
# Il couvre ce qui n'est ni le front ni le back: Dockerfile, workflows GitHub Actions, scripts Bash et Python.
# Le front et le back ont leur projet et leur configuration (front/sonar-project.properties et
# back/sonar-project.properties). Un Quality Gate par projet évite que les notes de l'application se mélangent
# à celles des outils.
#
# sonar.organization et sonar.projectKey ne sont volontairement pas écrits ici: le workflow les calcule à
# partir du contexte GitHub (propriétaire et nom du dépôt), pour ne pas coder un identifiant en dur.
#
# Nom affiché dans SonarQube Cloud, écrit pour les trois projets (cf. front/sonar-project.properties).
sonar.projectName=Orion infra (Dockerfile, workflows, scripts)

# Avec le mode « analysis scope » de SonarQube Cloud, tout le projet est analysé par défaut: sonar.sources,
# sonar.tests et sonar.test.inclusions n'ont plus d'effet, seules les exclusions restreignent le périmètre.
# Exclus:
# - front/ et back/: analysés par leurs propres projets;
# - docs/: documentation et exports JSON de Sonar, pas du code;
# - learning/: outils personnels de révision, ni livrés ni testés avec l'application (les analyser fausserait
#   la mesure);
# - tests des scripts (scripts/test_*.py), dossiers générés et fichiers binaires (sans cela le scanner les lit
#   comme du texte et émet des avertissements d'encodage sans intérêt).
sonar.exclusions=front/**,back/**,docs/**,learning/**,scripts/test_*.py,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.gradle/**,**/*.png,**/*.jpg,**/*.pdf,**/*.jar

# Pas de mesure de couverture dans ce projet: ce sont des outils, pas l'application. Les scripts ont leurs
# tests (job `coverage`), mais leur taux n'est pas suivi par Sonar.
sonar.coverage.exclusions=**/*

# Les fichiers cachés (dont .github/workflows) font partie du périmètre analysé.
sonar.scanner.excludeHiddenFiles=false
