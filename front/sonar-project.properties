# Projet SonarQube Cloud « front » (Angular), lu par le job `sonar-front` de .github/workflows/ci.yml avec
# `projectBaseDir: front`: tous les chemins ci-dessous sont relatifs à ce dossier.
# sonar.organization et sonar.projectKey ne sont pas écrits ici: le workflow les calcule à partir du contexte
# GitHub, pour ne pas coder un identifiant en dur.
#
# Avec le mode « analysis scope » de SonarQube Cloud, tout le projet est analysé par défaut: sonar.sources et
# sonar.tests n'ont plus d'effet, seules les exclusions restreignent le périmètre.
# Exclus: specs Angular et leur préparation (test-setup.ts), dossiers générés, fichiers binaires.
sonar.exclusions=**/*.spec.ts,src/test-setup.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/.angular/**,**/*.png,**/*.jpg,**/*.pdf

# Couverture: rapport lcov produit par `ng test --coverage` (job test-front). Les chemins du lcov sont relatifs à
# front/ (`src/...`), comme la base de ce projet: plus besoin de les réécrire.
sonar.javascript.lcov.reportPaths=coverage/microcrm/lcov.info
