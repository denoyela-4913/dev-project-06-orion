plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'jacoco'
	// Analyses du code Java, rattachées à `check` donc lancées par `./gradlew build` (job `build-back`).
	id 'checkstyle'
	// 6.5.13 : dernière version du plugin publiée depuis plus de 7 jours au 26/11/2026 (même délai que Dependabot).
	id 'com.github.spotbugs' version '6.5.13'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

// Verrouillage des dépendances (Sonar S8569): les versions résolues sont figées dans gradle.lockfile,
// l'équivalent du package-lock.json côté front. STRICT: le build échoue si le fichier manque ou si les
// versions résolues en diffèrent. Mise à jour voulue: ./gradlew dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
	lockMode = LockMode.STRICT
}

repositories {
	mavenCentral()
}

// Bloquants avec zéro écart (avertissements compris) : un défaut signalé fait échouer `check`.
checkstyle {
	toolVersion = '14.4.0'
	maxWarnings = 0
}

spotbugs {
	// Version de l'outil figée par gradle.lockfile, comme les autres dépendances.
	excludeFilter = file('config/spotbugs/exclude.xml')
}

// Rapport HTML lisible dans build/reports/spotbugs (le plugin n'en produit pas par défaut).
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
		xml.required = true
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Génère le rapport de couverture après les tests (lu par SonarQube).
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        // Format XML attendu par SonarQube (sonar.coverage.jacoco.xmlReportPaths).
        xml.required = true
    }
}