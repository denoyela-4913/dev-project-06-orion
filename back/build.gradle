plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'jacoco'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

// Verrouillage des dépendances (Sonar S8569): les versions résolues sont figées dans gradle.lockfile,
// l'équivalent du package-lock.json côté front. STRICT: le build échoue si le fichier manque ou si les
// versions résolues en diffèrent. Mise à jour voulue: ./gradlew dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
	lockMode = LockMode.STRICT
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Génère le rapport de couverture après les tests (lu par SonarQube).
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        // Format XML attendu par SonarQube (sonar.coverage.jacoco.xmlReportPaths).
        xml.required = true
    }
}