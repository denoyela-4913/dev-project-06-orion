spring.application.name=microcrm

# CORS: origines autorisées à appeler l'API depuis un navigateur (liste séparée par des virgules, sans « / »
# final). Par défaut, les deux origines du front: serveur de développement Angular et images Docker (Caddy en
# HTTPS). Autre déploiement: variable d'environnement APP_CORS_ALLOWED_ORIGINS.
# Ce n'est pas un contrôle d'accès: un client hors navigateur n'est pas concerné.
app.cors.allowed-origins=http://localhost:4200,https://localhost
