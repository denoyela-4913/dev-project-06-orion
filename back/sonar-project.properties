# Projet SonarQube Cloud « back » (Java, Spring Boot), lu par le job `sonar-back` de .github/workflows/ci.yml
# avec `projectBaseDir: back`: tous les chemins ci-dessous sont relatifs à ce dossier.
# sonar.organization et sonar.projectKey ne sont pas écrits ici: le workflow les calcule à partir du contexte
# GitHub, pour ne pas coder un identifiant en dur.
#
# Nom affiché dans SonarQube Cloud. Sans cette ligne, le scanner reprend le nom du projet Gradle ou npm
# (« microcrm » pour le front et le back), et les deux projets deviennent indiscernables.
sonar.projectName=Orion back

# Exclus: tests Java, dossiers générés, binaires. (Avec le mode « analysis scope », seules les exclusions
# restreignent le périmètre.)
sonar.exclusions=src/test/**,**/build/**,**/.gradle/**,**/*.jar

# Java: le scanner générique a besoin des classes compilées (produites par ./gradlew test dans le job test-back,
# puis transmises au job sonar-back par artefact, comme le rapport de couverture ci-dessous).
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Couverture: rapport JaCoCo (./gradlew test).
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
