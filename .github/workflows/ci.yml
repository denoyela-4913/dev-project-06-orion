# Port de .gitlab-ci.yml vers GitHub Actions.
# Chaque choix non trivial est justifié en commentaire.
#
# Convention pour les actions tierces : référencées par le SHA du commit, jamais par un tag
# (`@v4`) ni `latest`. Un tag peut être déplacé par son auteur, un SHA est immuable (sécurité de la
# chaîne d'approvisionnement, builds reproductibles). La version est TOUJOURS notée en commentaire
# à côté du SHA (`# v7.0.1`), pour qu'un humain voie la version sans résoudre le SHA.
# Dependabot (.github/dependabot.yml) met à jour le SHA et le commentaire ensemble.

name: CI

# push + pull_request, sans filtre de branche : équivalent du comportement par
# défaut de GitLab CI (pipeline à chaque push). Le workflow de dev impose de
# valider la CI sur la branche de dev (push) avant d'ouvrir la pull request.
on:
  push:
  pull_request:

jobs:
  # --- Stage "test" ---------------------------------------------------------
  test-front:
    # GitLab : image cypress/browsers (apporte Chrome). Ici les tests tournent avec Vitest dans Node, avec un
    # DOM simulé (jsdom) : aucun navigateur n'est nécessaire (cf. docs/KARMA.md).
    # `ubuntu-26.04` au lieu de `ubuntu-latest` : le label « latest » change de version sans
    # modification du dépôt (GitHub l'a fait migrer vers 26.04). Version fixe = builds reproductibles ;
    # 26.04 est celle sur laquelle la CI a été validée, et c'est une version LTS.
    runs-on: ubuntu-26.04
    # Remplace les "cd front" de GitLab, sans répéter la commande à chaque step.
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Version fixe (GitLab : "node" = latest). Angular ne supporte que
          # certaines versions de Node ; "latest" peut casser le build sans
          # changement de code. 24 est une LTS (fin de support 30/04/2028) supportée par
          # Angular 22, et la même que l'image du Dockerfile.
          node-version: 24
          # Depuis setup-node v5, un cache npm automatique peut s'activer selon le contenu de
          # package.json. Désactivé explicitement : décision de ne pas mettre de cache avant d'avoir
          # mesuré son gain (cf. docs/BACKLOG.md et docs/quality/ci-baseline).
          package-manager-cache: false
      # `--ignore-scripts` : n'exécute pas les scripts d'installation (preinstall/postinstall) des
      # ~900 paquets, vecteur classique d'attaque de la chaîne d'approvisionnement (règle Sonar S6505).
      # Vérifié: installation, build et tests passent sans ces scripts.
      - run: npm ci --ignore-scripts
      # GitLab : `npx @angular/cli test`. `npm test` exécute le script "test" de package.json
      # (`ng test`) avec l'Angular CLI déjà installé par `npm ci` : la version est celle du
      # package-lock.json et rien n'est téléchargé à la volée (règles Sonar S6505 et S8543).
      # `--coverage` : produit le rapport lcov que le job `sonar-front` récupère, sans relancer les tests.
      # `--watch=false` : un seul passage, sans dépendre de la détection de l'environnement de CI.
      - run: npm test -- --watch=false --coverage
      # Transmet la couverture au job `sonar-front` : chaque job a sa propre machine, rien n'est partagé sinon.
      # Envoyé aussi sur les branches sans Sonar : un envoi cassé se voit dès le run de push.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-front
          # Chemin relatif à la racine du dépôt : `working-directory` ne s'applique qu'aux étapes `run`.
          path: front/coverage/microcrm/lcov.info
          # Échec si le fichier manque, au lieu d'un avertissement qui laisserait Sonar sans couverture.
          if-no-files-found: error
          # Durée minimale : l'artefact ne sert qu'à ce run (au-delà, relancer tout le workflow).
          retention-days: 1

  test-back:
    # GitLab : image gradle:jdk17. Ici setup-java installe le JDK 21 (le code est compilé en Java 21).
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          # Temurin : distribution OpenJDK courante, la plus utilisée ;
          # version 21 = celle de build.gradle (sourceCompatibility = '21'), LTS jusqu'en 12/2029.
          distribution: temurin
          java-version: 21
          # Cache des dépendances Gradle et de la distribution du wrapper: évite de tout retélécharger à chaque
          # job, et limite l'exposition aux « 429 Too Many Requests » de Maven Central (sans la supprimer: un
          # cache absent ou périmé impose de télécharger).
          cache: gradle
          # Fichiers qui forment la clé du cache. Liste explicite car le choix par défaut ignore
          # gradle.lockfile (`**/*.gradle*` ne le couvre pas): le cache ne suivrait pas une mise à jour du verrou.
          cache-dependency-path: |
            back/build.gradle
            back/settings.gradle
            back/gradle.lockfile
            back/gradle/wrapper/gradle-wrapper.properties
          # Activé d'office avec `cache`: désactivé pour limiter ce changement aux dépendances Gradle.
          cache-jdk: false
      - run: ./gradlew test
      # Pour le job `sonar-back` : classes compilées (sonar.java.binaries et sonar.java.test.binaries) et rapport
      # JaCoCo. La racine de l'artefact est le dossier commun aux deux chemins, back/build.
      # Réglages : cf. justification dans test-front.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-back
          path: |
            back/build/classes/java
            back/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  # --- Seuils de couverture -------------------------------------------------
  # 80 % pour le front et pour le back, sur tout le code et sur le code nouveau (scripts/coverage_gate.py, à
  # partir des rapports des jobs de tests). Contrôle propre à Orion, en plus des Quality Gates Sonar : il porte
  # aussi sur tout le code (le gate par défaut de Sonar ne contrôle que le code nouveau) et il tourne sur les
  # branches de dev, où Sonar ne tourne pas.
  # BLOQUANT depuis le 26/11/2026 (le front et le back ont dépassé 80 % sur tout leur code) : un taux sous le
  # seuil fait échouer ce job et empêche les builds. Le réglage est écrit ici et non déduit des taux du run : un
  # blocage automatique se désactiverait dès qu'un taux repasserait sous le seuil.
  # Un rapport manquant ou un test du script en échec font aussi échouer le job.
  coverage:
    needs: [test-front, test-back]
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    env:
      COVERAGE_BLOCKING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : la comparaison avec la base a besoin de l'ancêtre commun.
          fetch-depth: 0
      # Tests du script avant de s'y fier. Python 3 est fourni par le runner, sans dépendance à installer.
      - run: python3 -m unittest discover -s scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-back
          path: back/build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-front
          path: front/coverage/microcrm
      - name: Vérifier les seuils de couverture
        env:
          # Code nouveau : sur une PR, depuis la branche visée ; sur une autre branche, depuis `main` ; sur
          # `main`, les commits du push. Passé par l'environnement : aucune valeur n'est insérée dans le script.
          BASE: >-
            ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
            || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: |
          options=(--base "$BASE")
          if [ "$COVERAGE_BLOCKING" = "true" ]; then options+=(--blocking); fi
          python3 scripts/coverage_gate.py "${options[@]}"

  # --- Stage "build" --------------------------------------------------------
  # Ordre des stages : tests, puis analyse Sonar (jobs `sonar-front`, `sonar-back` et `sonar-infra`, plus bas), puis build. GitHub n'a pas de
  # stages : "needs" reproduit ces dépendances (GitLab : "stages: test, build").
  # - Le Quality Gate Sonar n'est PAS bloquant pour l'instant : le scan n'attend pas son résultat
  #   (pas de `sonar.qualitygate.wait=true`) ; le rendre bloquant n'est pas encore décidé.
  # - Le build attend aussi `coverage`, qui échoue si un taux de couverture est sous le seuil.
  # - Un scan en échec technique (SonarCloud indisponible, jeton invalide) bloque en revanche le build :
  #   choix assumé pour garder une règle simple.
  # - Les jobs Sonar ne tournent que sur les PR et `main` : sur les autres branches ils sont sautés, et le build doit
  #   quand même s'exécuter.
  build-front:
    needs: [test-front, test-back, coverage, sonar-front, sonar-back, sonar-infra]
    # Cf. « Ordre des stages » ci-dessus: build si les deux tests ont réussi et si les trois jobs Sonar ont réussi ou ont été
    # sautés. `!cancelled()` est nécessaire: sans fonction de statut, GitHub saute aussi un job dont un
    # `needs` a été sauté.
    if: >-
      !cancelled() &&
      needs.test-front.result == 'success' && needs.test-back.result == 'success' &&
      needs.coverage.result == 'success' &&
      (needs.sonar-front.result == 'success' || needs.sonar-front.result == 'skipped') &&
      (needs.sonar-back.result == 'success' || needs.sonar-back.result == 'skipped') &&
      (needs.sonar-infra.result == 'success' || needs.sonar-infra.result == 'skipped')
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # même version que test-front (cf. justification)
          package-manager-cache: false # cf. justification dans test-front
      - run: npm ci --ignore-scripts # cf. justification dans test-front
      # GitLab : `npx @angular/cli build`. `npm run build` exécute `ng build` avec la version
      # du package-lock.json, sans téléchargement à la volée (cf. test-front).
      - run: npm run build -- --optimization

  build-back:
    needs: [test-front, test-back, coverage, sonar-front, sonar-back, sonar-infra]
    # Cf. « Ordre des stages » ci-dessus: build si les deux tests ont réussi et si les trois jobs Sonar ont réussi ou ont été
    # sautés. `!cancelled()` est nécessaire: sans fonction de statut, GitHub saute aussi un job dont un
    # `needs` a été sauté.
    if: >-
      !cancelled() &&
      needs.test-front.result == 'success' && needs.test-back.result == 'success' &&
      needs.coverage.result == 'success' &&
      (needs.sonar-front.result == 'success' || needs.sonar-front.result == 'skipped') &&
      (needs.sonar-back.result == 'success' || needs.sonar-back.result == 'skipped') &&
      (needs.sonar-infra.result == 'success' || needs.sonar-infra.result == 'skipped')
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin # cf. justification dans test-back
          java-version: 21
          # Mêmes réglages et même clé que test-back, qui s'exécute avant (cf. justification dans test-back):
          # ce job réutilise son cache, y compris dans le run qui vient de le créer.
          cache: gradle
          cache-dependency-path: |
            back/build.gradle
            back/settings.gradle
            back/gradle.lockfile
            back/gradle/wrapper/gradle-wrapper.properties
          cache-jdk: false
      # `build` et non `assemble` (décision du 26/11) : `build` lance `check`, auquel Checkstyle et SpotBugs sont
      # rattachés (cf. back/build.gradle, bloquants avec zéro écart). Ils s'exécutent ici, sur le code compilé,
      # et non dans le job de lint (ESLint et hadolint seulement). Coût accepté : les tests, déjà exécutés par
      # `test-back`, tournent une seconde fois.
      - run: ./gradlew build

  # --- Analyse de qualité ---------------------------------------------------
  # Trois projets SonarQube Cloud pour le même dépôt (support des monorepos), un scan par projet, en parallèle :
  # - `sonar-front` : front Angular, avec la couverture lcov du job `test-front` ;
  # - `sonar-back` : back Java, avec la couverture JaCoCo et les classes du job `test-back` ;
  # - `sonar-infra` : Dockerfile, workflows, scripts et le reste du dépôt, sans couverture (outils, pas l'application).
  # Chaque projet a son Quality Gate et ses notes. Le périmètre de chacun est décrit dans le
  # `sonar-project.properties` de son dossier de base (front/, back/ et racine pour l'infra).
  # Seulement sur les PR et sur main, comme l'analyse automatique précédente: pas d'analyse des autres
  # branches (non garanti par le plan gratuit). Les PR venant d'un fork n'ont pas accès au secret
  # SONAR_TOKEN: elles sont exclues pour ne pas échouer systématiquement.
  # Historique complet (`fetch-depth: 0`, recommandé par SonarSource): un clone superficiel dégrade l'attribution
  # du nouveau code et la détection des auteurs.
  sonar-front:
    # Après le test du front : inutile d'analyser un code dont les tests échouent.
    needs: [test-front]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # même version que test-front (cf. justification)
          package-manager-cache: false # cf. justification dans test-front
      # Les tests ne sont pas relancés, mais les dépendances restent nécessaires : l'analyse TypeScript lit
      # les types dans node_modules, et des règles en dépendent (ex. promesses non gérées).
      - run: npm ci --ignore-scripts # cf. justification dans test-front
        working-directory: front
      # Couverture du job `test-front`, replacée au chemin attendu par front/sonar-project.properties.
      # L'artefact est limité à ce run et son empreinte est vérifiée.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-front
          path: front/coverage/microcrm
      # Sans ce contrôle, un rapport manquant ne ferait qu'un avertissement et l'analyse serait faussée.
      - name: Vérifier la couverture reçue du job de test
        run: test -s front/coverage/microcrm/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: front
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_front

  sonar-back:
    # Après le test du back.
    needs: [test-back]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Résultats du job `test-back` (couverture et classes Java), replacés aux chemins attendus par
      # back/sonar-project.properties. Pas de setup-java : les tests ne tournent plus ici et le scanner
      # télécharge son propre JRE.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-back
          path: back/build
      # `if-no-files-found` n'échoue que si AUCUN chemin de l'artefact ne correspond. Sans ce contrôle, un
      # rapport ou un dossier de classes manquant ne ferait qu'un avertissement, et l'analyse serait faussée.
      - name: Vérifier les résultats reçus du job de test
        run: |
          test -s back/build/reports/jacoco/test/jacocoTestReport.xml
          test -d back/build/classes/java/main
          test -d back/build/classes/java/test
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: back
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_back

  sonar-infra:
    # Pas de `needs` : ce périmètre n'a ni test ni compilation à attendre, il part dès le début du run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: .
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_infra
