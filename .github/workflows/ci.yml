# Port de .gitlab-ci.yml vers GitHub Actions.
# Chaque choix non trivial est justifié en commentaire.
#
# Convention pour les actions tierces : référencées par le SHA du commit, jamais par un tag
# (`@v4`) ni `latest`. Un tag peut être déplacé par son auteur, un SHA est immuable (sécurité de la
# chaîne d'approvisionnement, builds reproductibles). La version est TOUJOURS notée en commentaire
# à côté du SHA (`# v7.0.1`), pour qu'un humain voie la version sans résoudre le SHA.
# Dependabot (.github/dependabot.yml) met à jour le SHA et le commentaire ensemble.

name: CI

# push + pull_request, sans filtre de branche : équivalent du comportement par
# défaut de GitLab CI (pipeline à chaque push). Le workflow de dev impose de
# valider la CI sur la branche de dev (push) avant d'ouvrir la pull request.
# workflow_dispatch : lancement à la main, sur la branche choisie (onglet Actions, ou `gh workflow run ci.yml
# --ref <branche>`). Il joue les tests, les images, les scans et le staging. Il ne publie rien : `candidate` exige un
# push sur `main`. Les analyses Sonar restent réservées aux PR et à `main`. GitHub ne propose ce lancement que
# lorsque ce déclencheur est présent sur la branche par défaut.
# paths-ignore : un push ou une PR qui ne touche que de la documentation ou les fiches ne lance pas la CI, qui ne lit
# aucun de ces fichiers. Un seul autre fichier modifié suffit à la lancer (sur une PR, c'est tout son diff qui compte).
# La liste est écrite deux fois : GitHub la lit séparément pour chaque déclencheur. Le lancement à la main n'est pas
# filtré. Attention si ces jobs deviennent un jour des contrôles obligatoires : une PR de documentation resterait en
# attente, faute de run.
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'learning/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'learning/**']
  workflow_dispatch:

# Jeton du workflow en lecture seule, écrit ici pour ne pas dépendre du réglage du dépôt. Les jobs qui doivent
# écrire le déclarent eux-mêmes (`release`, `notify`).
permissions:
  contents: read

jobs:
  # --- Stage "lint" ---------------------------------------------------------
  # Contrôles rapides, sans compilation, avant les tests (stage 1 du schéma) : ESLint pour le front, hadolint
  # pour le Dockerfile, et rien d'autre (décision du 26/11). Checkstyle et SpotBugs ont besoin du code compilé :
  # ils s'exécutent dans `test-back` avec `./gradlew check` (scripts/ci_test.sh).
  lint:
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hadolint depuis son image officielle, épinglée par version et digest : pas d'action tierce de plus. Le
      # Dockerfile est passé sur l'entrée standard, aucun fichier du dépôt n'est monté dans le conteneur.
      # Toute remarque, même `info`, fait échouer le job (comportement par défaut) : le Dockerfile n'en a aucune.
      - name: hadolint (Dockerfile)
        env:
          HADOLINT: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 # v2.15.1
        run: docker run --rm -i "$HADOLINT" hadolint - < Dockerfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # cf. justification dans test-front
          package-manager-cache: false # cf. justification dans test-front
      # Même commande que sur un poste ; `--ignore-scripts` : les scripts d'installation des paquets ne sont pas
      # exécutés (chaîne d'approvisionnement, Sonar S6505).
      - run: scripts/deps.sh install front
      # `--max-warnings 0` (script "lint" de package.json) : un avertissement fait aussi échouer le job.
      - name: ESLint (front)
        run: npm run lint
        working-directory: front

  # --- Stage "test" ---------------------------------------------------------
  # Les deux jobs de tests passent par l'étape de compilation du Dockerfile (scripts/ci_test.sh) : elle est
  # construite, les tests tournent dans un conteneur de cette étape, et son produit (front compilé, JAR) est transmis
  # au job `images`, qui ne le régénère pas. Les versions de Node, du JDK et de Gradle sont ainsi écrites une seule
  # fois, dans le Dockerfile. Contrepartie : pas de cache des dépendances d'un run à l'autre dans ces deux jobs
  # (cf. docs/BACKLOG.md, cache des couches Docker).
  test-front:
    needs: [lint] # un défaut de lint évite de lancer les tests (ordre du schéma)
    # Les tests tournent avec Vitest dans Node, avec un DOM simulé (jsdom) : aucun navigateur n'est nécessaire (cf.
    # docs/KARMA.md ; GitLab utilisait l'image cypress/browsers pour Chrome).
    # `ubuntu-26.04` au lieu de `ubuntu-latest` : le label « latest » change de version sans
    # modification du dépôt (GitHub l'a fait migrer vers 26.04). Version fixe = builds reproductibles ;
    # 26.04 est celle sur laquelle la CI a été validée, et c'est une version LTS.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci_test.sh front
      # Le front compilé dans la même étape que celle qui vient d'être testée : repris tel quel par `images`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-front
          path: artifacts/front
          if-no-files-found: error
          retention-days: 7
      # Transmet la couverture au job `sonar-front` : chaque job a sa propre machine, rien n'est partagé sinon.
      # Envoyé aussi sur les branches sans Sonar : un envoi cassé se voit dès le run de push.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-front
          # Chemin relatif à la racine du dépôt : `working-directory` ne s'applique qu'aux étapes `run`.
          path: front/coverage/microcrm/lcov.info
          # Échec si le fichier manque, au lieu d'un avertissement qui laisserait Sonar sans couverture.
          if-no-files-found: error
          # 7 jours pour tous les artefacts (demande du 27/11) : de quoi relire un run ou relancer un job en échec
          # dans la semaine, au lieu de relancer tout le workflow le lendemain.
          retention-days: 7

  test-back:
    needs: [lint]
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci_test.sh back
      # Le JAR compilé dans la même étape que celle qui vient d'être testée : repris tel quel par `images`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-back
          path: artifacts/back
          if-no-files-found: error
          retention-days: 7
      # Pour le job `sonar-back` : classes compilées (sonar.java.binaries et sonar.java.test.binaries) et rapport
      # JaCoCo. La racine de l'artefact est le dossier commun aux deux chemins, back/build.
      # Réglages : cf. justification dans test-front.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Aussi après un échec : les rapports d'un contrôle en échec sont lus par `sonar-back` et téléchargeables.
        if: ${{ !cancelled() }}
        with:
          name: analysis-back
          path: |
            back/build/classes/java
            back/build/reports/jacoco/test/jacocoTestReport.xml
            back/build/reports/checkstyle
            back/build/reports/spotbugs
          if-no-files-found: error
          retention-days: 7

  # --- Contrôle de l'infrastructure ------------------------------------------
  # Chart Helm et scripts d'exploitation, sans cluster. Ce n'est pas le job `lint` (réservé à ESLint et
  # hadolint) : il vérifie que ce qui servira au déploiement se construit pour les trois environnements.
  infra-check:
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Helm 4 : la branche 3 ne reçoit plus de correctifs de sécurité après le 10/02/2027
          # (https://helm.sh/blog/helm-v3-end-of-life/), avant le seuil du projet (05/2027). Version fixe.
          version: v4.3.2
      - name: Chart Helm, pour les trois environnements
        run: |
          chart=deploy/helm/microcrm
          for environment in dev staging production; do
            values=()
            if [[ "$environment" != dev ]]; then values+=(--values "$chart/values-prodlike.yaml"); fi
            values+=(--values "$chart/values-$environment.yaml")
            helm lint "$chart" --strict "${values[@]}"
            helm template microcrm "$chart" "${values[@]}" > /dev/null
          done
      - name: Staging identique à la production, hors valeurs d'installation
        run: scripts/check_parity.sh
      # Le déploiement par empreinte ne sert que sur `main` : il est contrôlé ici sur chaque branche.
      - name: Le chart désigne les images par leur empreinte
        run: |
          digest="sha256:$(printf '0%.0s' {1..64})"
          rendered=$(helm template microcrm deploy/helm/microcrm \
            --set "images.digests.back=$digest" --set "images.digests.front=$digest")
          [[ $(grep -cE "image: \"microcrm-(back|front)@$digest\"" <<<"$rendered") -eq 2 ]]
          if helm template microcrm deploy/helm/microcrm --set images.digests.back=latest > /dev/null 2>&1; then
            echo "::error::le chart devrait refuser une empreinte invalide" >&2
            exit 1
          fi
      - name: Le chart refuse plusieurs instances du back
        run: |
          if helm template microcrm deploy/helm/microcrm --set back.replicas=2 > /dev/null 2>&1; then
            echo "::error::le chart devrait refuser back.replicas=2" >&2
            exit 1
          fi
      # Ici et non dans le job `lint`, réservé à ESLint et hadolint. Toute remarque fait échouer le job.
      - name: ShellCheck des scripts
        run: scripts/lint_scripts.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Terraform n'a pas de LTS : version fixe, suivie à la mineure (cf. deploy/terraform/README.md).
          terraform_version: 1.17.2
          # Sans l'enveloppe de l'action, les codes de sortie de terraform sont transmis tels quels.
          terraform_wrapper: false
      - name: Terraform, mise en forme
        run: terraform fmt -check -recursive -diff deploy/terraform
      - name: Terraform, validation des trois environnements
        run: |
          for environment in dev staging production; do
            cd "deploy/terraform/environments/$environment"
            # `-lockfile=readonly` : échec si les fournisseurs ne correspondent pas au fichier de verrouillage.
            terraform init -backend=false -input=false -lockfile=readonly
            terraform validate
            cd - > /dev/null
          done
      - name: Terraform, tests du module platform (fournisseur simulé, sans cluster)
        working-directory: deploy/terraform/modules/platform
        run: |
          terraform init -backend=false -input=false
          terraform test

  # --- Seuils de couverture -------------------------------------------------
  # 80 % pour le front et pour le back, sur tout le code et sur le code nouveau (scripts/coverage_gate.py, à
  # partir des rapports des jobs de tests). Contrôle propre à Orion, en plus des Quality Gates Sonar : il porte
  # aussi sur tout le code (le gate par défaut de Sonar ne contrôle que le code nouveau) et il tourne sur les
  # branches de dev, où Sonar ne tourne pas.
  # BLOQUANT depuis le 26/11/2026 (le front et le back ont dépassé 80 % sur tout leur code) : un taux sous le
  # seuil fait échouer ce job et empêche les builds. Le réglage est écrit ici et non déduit des taux du run : un
  # blocage automatique se désactiverait dès qu'un taux repasserait sous le seuil.
  # Un rapport manquant ou un test du script en échec font aussi échouer le job.
  coverage:
    needs: [test-front, test-back]
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    env:
      COVERAGE_BLOCKING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : la comparaison avec la base a besoin de l'ancêtre commun.
          fetch-depth: 0
      # Tests du script avant de s'y fier. Python 3 est fourni par le runner, sans dépendance à installer.
      - run: python3 -m unittest discover -s scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-back
          path: back/build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-front
          path: front/coverage/microcrm
      - name: Vérifier les seuils de couverture
        env:
          # Code nouveau : sur une PR, depuis la branche visée ; sur une autre branche, depuis `main` ; sur
          # `main`, les commits du push. Passé par l'environnement : aucune valeur n'est insérée dans le script.
          BASE: >-
            ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
            || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: |
          options=(--base "$BASE")
          if [ "$COVERAGE_BLOCKING" = "true" ]; then options+=(--blocking); fi
          python3 scripts/coverage_gate.py "${options[@]}"

  # --- Stage "build" --------------------------------------------------------
  # La compilation a lieu dans les jobs de tests ; ce stage assemble les images.
  # Ordre des stages : tests, puis analyse Sonar (jobs `sonar-front`, `sonar-back` et `sonar-infra`, plus bas), puis
  # images. GitHub n'a pas de stages : "needs" reproduit ces dépendances (GitLab : "stages: test, build").
  # - Le Quality Gate Sonar n'est PAS bloquant pour l'instant : le scan n'attend pas son résultat
  #   (pas de `sonar.qualitygate.wait=true`) ; le rendre bloquant n'est pas encore décidé.
  # - Les images attendent aussi `coverage`, qui échoue si un taux de couverture est sous le seuil.
  # - Un scan en échec technique (SonarCloud indisponible, jeton invalide) bloque en revanche les images :
  #   choix assumé pour garder une règle simple.
  # - Les jobs Sonar ne tournent que sur les PR et `main` : sur les autres branches ils sont sautés, et les images
  #   doivent quand même être construites. `!cancelled()` est nécessaire : sans fonction de statut, GitHub saute aussi
  #   un job dont un `needs` a été sauté.
  # Les images front et back, construites avec les mêmes conditions que les builds applicatifs. Elles ne
  # recompilent rien : le front compilé et le JAR sont les artefacts des jobs de tests, qui remplacent les étapes
  # `front-dist` et `back-dist` du Dockerfile (scripts/build_images.sh, qui échoue si une compilation a lieu quand
  # même). Chaque image est transmise aux jobs suivants par artefact : ce qui est testé, scanné puis publié est la
  # même image, pas une reconstruction. Commande `docker` du runner, sans action tierce.
  images:
    needs: [test-front, test-back, coverage, sonar-front, sonar-back, sonar-infra]
    if: >-
      !cancelled() &&
      needs.test-front.result == 'success' && needs.test-back.result == 'success' &&
      needs.coverage.result == 'success' &&
      (needs.sonar-front.result == 'success' || needs.sonar-front.result == 'skipped') &&
      (needs.sonar-back.result == 'success' || needs.sonar-back.result == 'skipped') &&
      (needs.sonar-infra.result == 'success' || needs.sonar-infra.result == 'skipped')
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-front
          path: artifacts/front
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-back
          path: artifacts/back
      - name: Construire les images à partir des artefacts
        env:
          # Labels OCI : le registre rattache le paquet au dépôt et au commit d'origine.
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
        run: scripts/build_images.sh artifacts
      - name: Exporter les images
        run: |
          for target in front back; do
            docker save "microcrm-$target:ci" | gzip > "image-$target.tar.gz"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-front
          path: image-front.tar.gz
          if-no-files-found: error
          retention-days: 7
          # Déjà compressée par gzip.
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-back
          path: image-back.tar.gz
          if-no-files-found: error
          retention-days: 7
          # Déjà compressée par gzip.
          compression-level: 0

  # Test de déploiement des images avec Docker Compose, dans les trois environnements : santé, application, API à
  # travers le front, écriture avec l'origine du navigateur (scripts/smoke_test.sh).
  compose-test:
    needs: [images]
    # `!cancelled()` : sans fonction de statut, ce job serait sauté quand un job plus haut a été sauté (Sonar sur
    # une branche de dev), même si `images` a réussi.
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    env:
      BACK_IMAGE: microcrm-back:ci
      FRONT_IMAGE: microcrm-front:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-front
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-back
      - run: |
          docker load -i image-front.tar.gz
          docker load -i image-back.tar.gz
      - name: Environnement dev
        run: |
          scripts/compose.sh dev up -d --no-build --wait --wait-timeout 180
          scripts/smoke_test.sh http://localhost:4280
          scripts/compose.sh dev down -v
      - name: Environnement staging (HTTPS, certificat interne, comme la production)
        run: |
          scripts/compose.sh staging up -d --no-build --wait --wait-timeout 180
          SMOKE_INSECURE=1 scripts/smoke_test.sh https://localhost:4443
          scripts/compose.sh staging down -v
      - name: Environnement production (HTTPS, certificat interne)
        run: |
          scripts/compose.sh production up -d --no-build --wait --wait-timeout 180
          SMOKE_INSECURE=1 scripts/smoke_test.sh https://localhost
          scripts/compose.sh production down -v
      - name: Journaux en cas d'échec
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -n1 docker logs --tail 100

  # Tests de bout en bout : un vrai navigateur (Chromium, image Playwright épinglée par digest) parcourt
  # l'application construite par ce run, lancée avec Compose : création, modification, suppression, liens entre
  # personnes et organisations (clavier compris), saisie refusée et API indisponible (e2e/tests/).
  e2e:
    needs: [images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    env:
      BACK_IMAGE: microcrm-back:ci
      FRONT_IMAGE: microcrm-front:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-front
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-back
      - run: |
          docker load -i image-front.tar.gz
          docker load -i image-back.tar.gz
      - run: scripts/compose.sh dev up -d --no-build --wait --wait-timeout 180
      - run: scripts/e2e.sh http://localhost:4280
      - name: Journaux de l'application en cas d'échec
        if: failure()
        run: scripts/compose.sh dev logs --tail 100
      # Rapport et traces Playwright pour diagnostiquer un échec sans le reproduire.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # --- Stage "scan" ---------------------------------------------------------
  # Trivy sur les deux images construites par `images` (celles qui seront publiées) et sur le dépôt
  # (dépendances, secrets, configurations). Bloquant sur une vulnérabilité critique ou haute qui a un correctif.
  # Image de Trivy épinglée par digest dans scripts/trivy.sh, sans action tierce (cf. ce script). Un seul job
  # pour ne télécharger la base de vulnérabilités qu'une fois.
  scan:
    needs: [images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - run: for image in image-*.tar.gz; do docker load -i "$image"; done
      - name: Scanner le dépôt (dépendances, secrets, configurations)
        run: scripts/trivy.sh repo
      - name: Scanner les images
        # Même si le scan du dépôt a échoué : on veut les deux résultats dans le même run.
        if: ${{ !cancelled() }}
        run: scripts/trivy.sh image microcrm-front:ci microcrm-back:ci

  # --- Stage "candidate" (main seulement) -------------------------------------
  # Version SemVer calculée à partir des commits conventionnels depuis le dernier tag (scripts/release.py) ; sans
  # `feat`, `fix`, `perf`, `build` ni changement incompatible, rien n'est publié. Sinon, les images de ce run
  # (celles qui ont été testées et scannées, pas une reconstruction) sont envoyées sur GHCR sous une étiquette
  # « candidate », et leurs empreintes sont transmises au staging puis à la release. Une candidate n'est pas une
  # version : ni tag Git, ni release, ni étiquette de version.
  candidate:
    needs: [images, compose-test, e2e, scan, infra-check]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.images.result == 'success' && needs.compose-test.result == 'success' &&
      needs.scan.result == 'success' && needs.infra-check.result == 'success' && needs.e2e.result == 'success'
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    permissions:
      contents: read
      packages: write
    outputs:
      planned: ${{ steps.check.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      front-digest: ${{ steps.push.outputs.front }}
      back-digest: ${{ steps.push.outputs.back }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique et tags complets : la version se calcule depuis le dernier tag.
          fetch-depth: 0
      - name: Calculer la version
        id: plan
        run: python3 scripts/release.py >> "$GITHUB_OUTPUT"
      - name: Vérifier que la version n'est pas déjà publiée
        id: check
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # Un run plus récent a pu publier cette version pendant que celui-ci attendait.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG existe déjà, rien à publier"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.publish == 'true'
        with:
          pattern: image-*
          merge-multiple: true
      - name: Envoyer les images candidates sur GHCR
        id: push
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          for image in image-*.tar.gz; do docker load -i "$image"; done
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          scripts/candidate_images.sh push "ghcr.io/$GITHUB_REPOSITORY/" "candidate-${GITHUB_SHA::12}" digests.env
          cat digests.env >> "$GITHUB_OUTPUT"

  # --- Stage "staging" --------------------------------------------------------
  # Déploiement de dev puis de staging avec Terraform et le chart Helm sur un cluster kind créé dans le runner,
  # test de santé HTTP de chacun, puis épreuve des secours sur staging (sauvegarde et restauration, annulation
  # d'une version qui ne démarre pas, retour arrière d'une version qui échoue au test). Le staging est identique à
  # la production (scripts/check_parity.sh). Le cluster est jetable : aucun hébergement permanent n'est choisi
  # (cf. docs/BACKLOG.md). C'est la validation exigée avant la release.
  # Quand une version est prévue (`main`), le cluster lit les images candidates sur GHCR par leur empreinte : ce
  # sont celles que la release désignera et que la production déploiera. Sinon (PR, ou `main` sans nouvelle
  # version), les images du run sont chargées telles quelles dans le cluster.
  staging:
    needs: [images, compose-test, e2e, scan, infra-check, candidate]
    # `candidate` est sauté hors de `main` : le staging s'exécute quand même. Son échec, lui, l'arrête.
    # Sur les PR et `main` seulement, comme Sonar : c'est le job le plus long, et la CI d'une branche de dev, qui
    # précède toujours sa PR, n'a pas à le faire une première fois. Un lancement à la main le joue toujours.
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main') &&
      needs.images.result == 'success' && needs.compose-test.result == 'success' &&
      needs.scan.result == 'success' && needs.infra-check.result == 'success' && needs.e2e.result == 'success' &&
      (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    timeout-minutes: 20
    outputs:
      version: ${{ steps.images.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2 # cf. justification dans infra-check
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2 # cf. justification dans infra-check
          terraform_wrapper: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          # Kubernetes 1.36 (maintenu au-delà de 05/2027), image du nœud épinglée par digest.
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: orion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate.outputs.planned != 'true'
        with:
          pattern: image-*
          merge-multiple: true
      - name: Préparer les images
        id: images
        env:
          PLANNED: ${{ needs.candidate.outputs.planned }}
          PLANNED_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          if [[ "$PLANNED" = "true" ]]; then
            # Rien à charger : le cluster tire les images candidates (publiques) par leur empreinte, comme le
            # ferait un cluster de production.
            echo "version=$PLANNED_VERSION" >> "$GITHUB_OUTPUT"
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}/" >> "$GITHUB_OUTPUT"
          else
            version="ci-${GITHUB_SHA::12}"
            for target in front back; do
              docker load -i "image-$target.tar.gz"
              docker tag "microcrm-$target:ci" "microcrm-$target:$version"
            done
            kind load docker-image --name orion "microcrm-front:$version" "microcrm-back:$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Déployer et vérifier dev puis staging
        env:
          ENVIRONMENTS: dev staging
          VERSION: ${{ steps.images.outputs.version }}
          PREFIX: ${{ steps.images.outputs.prefix }}
          BACK_DIGEST: ${{ needs.candidate.outputs.back-digest }}
          FRONT_DIGEST: ${{ needs.candidate.outputs.front-digest }}
          KUBE_CONTEXT: kind-orion
        run: scripts/deploy_demo.sh "$VERSION" "$PREFIX"
      - name: État du cluster en cas d'échec
        if: failure()
        run: |
          kubectl get all,pvc -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  # --- Stage "release" (main, après validation du staging) --------------------
  # Les empreintes validées en staging reçoivent l'étiquette de version, sans reconstruction, puis la release
  # GitHub est créée en PRÉ-VERSION, avec le tag, les notes, le chart Helm et les empreintes (images-digests.env).
  # Le passage en production consiste à changer son statut (de « pre-release » à release) : cela déclenche
  # promote.yml, qui déploie ces mêmes empreintes. Le tag vient en dernier : il n'existe que pour une version
  # complète. En cas d'envoi interrompu, relancer le job.
  release:
    needs: [candidate, staging]
    if: >-
      !cancelled() && needs.candidate.result == 'success' && needs.candidate.outputs.planned == 'true' &&
      needs.staging.result == 'success'
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    # Seul job qui peut écrire dans le dépôt.
    permissions:
      contents: write
      packages: write
    # Une release à la fois : deux runs de `main` rapprochés calculeraient la même version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rédiger les notes
        run: python3 scripts/release.py > /dev/null
      - name: Vérifier que la version n'est pas déjà publiée
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG existe déjà, rien à publier"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Donner l'étiquette de version aux images validées
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.candidate.outputs.version }}
          FRONT_DIGEST: ${{ needs.candidate.outputs.front-digest }}
          BACK_DIGEST: ${{ needs.candidate.outputs.back-digest }}
        run: |
          printf '%s\n' "front=$FRONT_DIGEST" "back=$BACK_DIGEST" > images-digests.env
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # `github.run_attempt` > 1 : relance après un envoi interrompu, la version partielle est remplacée.
          FORCE=$(( GITHUB_RUN_ATTEMPT > 1 )) scripts/candidate_images.sh tag "ghcr.io/$GITHUB_REPOSITORY/" \
            "$VERSION" images-digests.env
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: steps.check.outputs.publish == 'true'
        with:
          version: v4.3.2 # cf. justification dans infra-check
      - name: Créer la pré-version (tag, notes, chart Helm, empreintes)
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          helm package deploy/helm/microcrm --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          printf '\n---\n\nValidée en staging. Pour la mettre en production, décocher « pre-release » et la marquer comme dernière version.\n' \
            >> release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md \
            --prerelease dist-chart/*.tgz images-digests.env
          echo "Pré-version $TAG publiée, en attente du passage en production" >> "$GITHUB_STEP_SUMMARY"

  # Notification du résultat : résumé du run toujours ; sur `main`, commentaire du commit (GitHub prévient par
  # courriel les personnes abonnées) et webhook si le secret NOTIFY_WEBHOOK_URL existe.
  notify:
    needs: [candidate, staging, release]
    # Même en cas d'échec ; pas quand le déploiement n'a pas été tenté (branche dont la CI a échoué plus tôt).
    if: ${{ !cancelled() && needs.staging.result != 'skipped' }}
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    permissions:
      # `write` pour commenter le commit.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notifier le résultat
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING: ${{ needs.staging.result }}
          RELEASE: ${{ needs.release.result }}
          VERSION: ${{ needs.staging.outputs.version }}
          NOTIFY_COMMIT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
          NOTIFY_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.NOTIFY_WEBHOOK_URL || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failure
          if [[ "$STAGING" = "success" && "$RELEASE" != "failure" ]]; then status=success; fi
          message="démonstration dev et staging, version ${VERSION:-inconnue}"
          if [[ "$RELEASE" = "success" ]]; then message="$message (pré-version publiée, production en attente)"; fi
          if [[ "$RELEASE" = "failure" ]]; then message="$message (publication de la pré-version en échec)"; fi
          scripts/notify.sh "$status" "$message"

  # --- Analyse de qualité ---------------------------------------------------
  # Trois projets SonarQube Cloud pour le même dépôt (support des monorepos), un scan par projet, en parallèle :
  # - `sonar-front` : front Angular, avec la couverture lcov du job `test-front` ;
  # - `sonar-back` : back Java, avec la couverture JaCoCo et les classes du job `test-back` ;
  # - `sonar-infra` : Dockerfile, workflows, scripts et le reste du dépôt, sans couverture (outils, pas l'application).
  # Chaque projet a son Quality Gate et ses notes. Le périmètre de chacun est décrit dans le
  # `sonar-project.properties` de son dossier de base (front/, back/ et racine pour l'infra).
  # Seulement sur les PR et sur main, comme l'analyse automatique précédente: pas d'analyse des autres
  # branches (non garanti par le plan gratuit). Les PR venant d'un fork n'ont pas accès au secret
  # SONAR_TOKEN: elles sont exclues pour ne pas échouer systématiquement.
  # Historique complet (`fetch-depth: 0`, recommandé par SonarSource): un clone superficiel dégrade l'attribution
  # du nouveau code et la détection des auteurs.
  sonar-front:
    # Après le test du front : inutile d'analyser un code dont les tests échouent.
    needs: [test-front]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # même version que test-front (cf. justification)
          package-manager-cache: false # cf. justification dans test-front
      # Les tests ne sont pas relancés, mais les dépendances restent nécessaires : l'analyse TypeScript lit
      # les types dans node_modules, et des règles en dépendent (ex. promesses non gérées).
      # Même commande que sur un poste ; `--ignore-scripts` : les scripts d'installation des paquets ne sont pas
      # exécutés (chaîne d'approvisionnement, Sonar S6505).
      - run: scripts/deps.sh install front
      # Couverture du job `test-front`, replacée au chemin attendu par front/sonar-project.properties.
      # L'artefact est limité à ce run et son empreinte est vérifiée.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-front
          path: front/coverage/microcrm
      # Sans ce contrôle, un rapport manquant ne ferait qu'un avertissement et l'analyse serait faussée.
      - name: Vérifier la couverture reçue du job de test
        run: test -s front/coverage/microcrm/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: front
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_front

  sonar-back:
    # Après le test du back, même en échec : Sonar importe alors les écarts de Checkstyle et de SpotBugs, qui sont
    # ceux qu'on veut y lire. Le run reste en échec et les images ne sont pas construites. Une compilation arrêtée
    # ne laisse pas les classes attendues : le job échoue alors sur son contrôle des résultats reçus.
    needs: [test-back]
    if: >-
      !cancelled() && (needs.test-back.result == 'success' || needs.test-back.result == 'failure') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Résultats du job `test-back` (couverture, classes Java, rapports Checkstyle et SpotBugs), replacés aux chemins attendus par
      # back/sonar-project.properties. Pas de setup-java : les tests ne tournent plus ici et le scanner
      # télécharge son propre JRE.
      # Le scanner détecte le projet Gradle et en demande les informations au wrapper, qui télécharge alors toute la
      # distribution Gradle (38 s mesurées sur 91 s de job, run 45921077822). Ce cache la conserve d'un run à
      # l'autre ; sa clé change avec la version de Gradle.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('back/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis-back
          path: back/build
      # `if-no-files-found` n'échoue que si AUCUN chemin de l'artefact ne correspond. Sans ce contrôle, un
      # rapport ou un dossier de classes manquant ne ferait qu'un avertissement, et l'analyse serait faussée.
      - name: Vérifier les résultats reçus du job de test
        run: |
          test -s back/build/reports/jacoco/test/jacocoTestReport.xml
          test -d back/build/classes/java/main
          test -d back/build/classes/java/test
          # Un rapport absent après des tests réussis ferait disparaître ses résultats de Sonar sans erreur. Après un
          # échec, le scan se fait avec les rapports qui existent.
          if [[ "$TESTS" = success ]]; then
            for tool in checkstyle spotbugs; do
              test -s "back/build/reports/$tool/main.xml"
            done
          fi
        env:
          TESTS: ${{ needs.test-back.result }}
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: back
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_back

  sonar-infra:
    # Pas de `needs` : ce périmètre n'a ni test ni compilation à attendre, il part dès le début du run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04 # cf. justification dans test-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Dossier de base du scan: le `sonar-project.properties` de ce dossier décrit le périmètre de cette partie.
          projectBaseDir: .
          # Organisation et clé déduites du dépôt GitHub (<propriétaire>_<dépôt>_<partie>, modèle de la
          # documentation Sonar pour les monorepos) pour ne pas les écrire en dur.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_infra
