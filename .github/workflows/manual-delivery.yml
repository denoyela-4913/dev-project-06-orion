# Livraison manuelle de secours (« forcer » sur le schéma) : quand l'automatisation de ci.yml n'a pas livré, ou
# pour rejouer le déploiement d'une version publiée. Se lance à la main (onglet Actions, droit d'écriture requis).
#   - publish = true  : construit les images depuis la référence choisie, les scanne et les publie sur GHCR sous
#     la version donnée (refusé si la version existe déjà) ;
#   - dans les deux cas : déploie la version sur le cluster de démonstration et la vérifie.
# Si GitHub Actions lui-même est indisponible, les mêmes scripts se lancent depuis un poste
# (docs/DEPLOIEMENT.md, « Livraison manuelle de secours »).
name: Livraison manuelle de secours

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version à livrer (X.Y.Z)
        required: true
        type: string
      publish:
        description: Construire et publier cette version depuis la référence choisie
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-26.04 # cf. justification dans ci.yml
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Saisie de l'utilisateur : passée par l'environnement, jamais insérée dans un script, et vérifiée.
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Vérifier la version demandée
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version attendue : X.Y.Z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Construire, scanner et publier
        if: inputs.publish
        run: |
          for target in front back standalone; do
            docker build --target "$target" -t "microcrm-$target:ci" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          done
          scripts/trivy.sh image microcrm-front:ci microcrm-back:ci microcrm-standalone:ci
          scripts/publish_images.sh "ghcr.io/$GITHUB_REPOSITORY/" "$VERSION"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: orion
      - name: Relire la version publiée et la déployer
        env:
          KUBE_CONTEXT: kind-orion
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}/"
          for target in front back; do
            docker pull "${prefix}microcrm-$target:$VERSION"
            docker tag "${prefix}microcrm-$target:$VERSION" "microcrm-$target:$VERSION"
          done
          kind load docker-image --name orion "microcrm-front:$VERSION" "microcrm-back:$VERSION"
          scripts/deploy_demo.sh "$VERSION"
      - name: Notifier le résultat
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/notify.sh "$([[ "$STATUS" = success ]] && echo success || echo failure)" "livraison manuelle de la version $VERSION"
